<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Raspberry Pi Zero 2 W connector edge</title>
  <desc id="diagram-desc">Top view of the board. Along the lower edge, from the microSD end: mini HDMI, the USB On-The-Go port, then PWR IN. The signer cable goes in the USB port.</desc>
  <g fill="none" stroke="#8b8b8b" stroke-width="2.5">
    <rect x="60" y="70" width="560" height="258" rx="12"/>
    <rect x="110" y="84" width="430" height="24" rx="3"/>
    <rect x="44" y="170" width="32" height="60" rx="3"/>
    <rect x="604" y="180" width="32" height="44" rx="3"/>
    <rect x="150" y="316" width="54" height="24" rx="3"/>
    <rect x="470" y="316" width="38" height="24" rx="3"/>
  </g>
  <rect x="330" y="316" width="38" height="24" rx="3" fill="none" stroke="#f97316" stroke-width="3.5"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#8b8b8b">
    <text x="325" y="101" text-anchor="middle">40-pin GPIO header</text>
    <text x="30" y="204" text-anchor="middle" transform="rotate(-90 30 204)">microSD</text>
    <text x="670" y="206" text-anchor="middle" transform="rotate(-90 670 206)">camera</text>
  </g>
  <g stroke="#8b8b8b" stroke-width="1.5">
    <path d="M177 340 V 366"/>
    <path d="M489 340 V 366"/>
  </g>
  <path d="M349 340 V 398" stroke="#f97316" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15">
    <text x="177" y="386" text-anchor="middle" fill="#8b8b8b">mini HDMI</text>
    <text x="489" y="386" text-anchor="middle" fill="#8b8b8b">PWR IN — power only</text>
    <text x="349" y="420" text-anchor="middle" fill="#f97316" font-weight="700">USB — the data port, plug the cable in here</text>
  </g>
</svg>
