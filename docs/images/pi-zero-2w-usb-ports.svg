    <rect width="700" height="440" fill="#fff"/>
    <g fill="#000">
      <rect x="129.94" y="268.4" width="93.48" height="64.41"/>
      <rect x="391.55" y="287.58" width="69.32" height="51.17"/>
      <rect x="500" y="287.58" width="69.32" height="51.17"/>
    </g>
  </mask>
