[workspace]
members = [
    "libs/crypto",
    "libs/flash-manifest",
    "libs/release-signature",
    "libs/signer",
    "libs/storage",
    "libs/epd-2in13-v4",
    "libs/ui",
    "libs/xmss",
    "rpi-signer",
    "host-utility",
    "xtask",
]
resolver = "2"

# Vendored upstream crates carry their own workspace; keep Cargo from absorbing them.
exclude = ["vendors"]

[workspace.package]
edition = "2024"
authors = ["Richard Ayotte"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Shared dependencies across workspace
[workspace.dependencies]
log = { version = "0.4", features = ["release_max_level_info"] }

# Dev profile - enable optimizations for usable debug builds
[profile.dev]
opt-level = 1             # Basic optimizations, better debuggability
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.epd-2in13-v4]
opt-level = 3
[profile.dev.package.embedded-graphics]
opt-level = 3
# leanVM's BLAKE2s, which XMSS key generation spends its time in.
[profile.dev.package.primitives]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.profiling]
inherits = "release"
# Symbols a profiler reads from the binary itself.
debug = true
strip = false
split-debuginfo = "off"
# Functions kept distinct across crate boundaries, so a sample lands on the
# function that ran it.
lto = false
codegen-units = 256
